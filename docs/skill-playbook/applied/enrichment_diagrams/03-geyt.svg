<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="340" fill="#0f172a"/>
  <text x="40" y="46" fill="#e2e8f0" font-size="24" font-weight="700">Гейт между этапами</text>
  <text x="40" y="72" fill="#94a3b8" font-size="14">Этап N+1 открывается только после прохождения всех порогов этапа N</text>

  <rect x="40" y="110" width="220" height="110" rx="12" fill="#1e293b" stroke="#38bdf8"/>
  <text x="150" y="142" fill="#bae6fd" font-size="15" font-weight="700" text-anchor="middle">ЭТАП N</text>
  <text x="150" y="168" fill="#94a3b8" font-size="12" text-anchor="middle">шаги 1..k</text>
  <text x="150" y="190" fill="#94a3b8" font-size="12" text-anchor="middle">артефакт создан</text>

  <rect x="320" y="110" width="240" height="110" rx="12" fill="#422006" stroke="#f59e0b" stroke-width="2"/>
  <text x="440" y="140" fill="#fde68a" font-size="15" font-weight="700" text-anchor="middle">skill-qc · ГЕЙТ</text>
  <text x="440" y="166" fill="#fcd34d" font-size="12" text-anchor="middle">порог содержит число</text>
  <text x="440" y="186" fill="#fcd34d" font-size="12" text-anchor="middle">PASS / FAIL / SKIP</text>
  <text x="440" y="206" fill="#fcd34d" font-size="12" text-anchor="middle">результат в progress.json</text>

  <rect x="620" y="110" width="240" height="110" rx="12" fill="#052e16" stroke="#22c55e"/>
  <text x="740" y="142" fill="#bbf7d0" font-size="15" font-weight="700" text-anchor="middle">ЭТАП N+1</text>
  <text x="740" y="168" fill="#86efac" font-size="12" text-anchor="middle">открыт при PASS</text>
  <text x="740" y="190" fill="#86efac" font-size="12" text-anchor="middle">иначе → новая задача</text>

  <path d="M 265 165 L 312 165" stroke="#38bdf8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M 565 165 L 612 165" stroke="#22c55e" stroke-width="2" marker-end="url(#g)"/>
  <text x="288" y="155" fill="#94a3b8" font-size="11" text-anchor="middle">проверка</text>
  <text x="588" y="155" fill="#22c55e" font-size="11" text-anchor="middle">PASS</text>

  <path d="M 440 225 L 440 265 L 150 265 L 150 225" stroke="#ef4444" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <text x="295" y="258" fill="#fca5a5" font-size="12" text-anchor="middle">FAIL → вернуться к шагу, записать в log.md</text>

  <text x="40" y="310" fill="#64748b" font-size="12">Слова «хорошо / достаточно / аккуратно» в порогах запрещены: их нельзя проверить.</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/></marker>
  </defs>
</svg>

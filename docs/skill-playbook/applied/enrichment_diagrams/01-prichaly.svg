<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="420" fill="#0f172a"/>
  <text x="40" y="46" fill="#e2e8f0" font-size="24" font-weight="700">Причалы умений DeepSeek Harness</text>
  <text x="40" y="72" fill="#94a3b8" font-size="14">Порядок чтения диспетчерской: от меньшего ранга к большему</text>

  <g>
    <rect x="40" y="100" width="150" height="70" rx="10" fill="#1e293b" stroke="#475569"/>
    <text x="115" y="128" fill="#cbd5e1" font-size="13" text-anchor="middle">Ранг 100</text>
    <text x="115" y="150" fill="#94a3b8" font-size="12" text-anchor="middle">проектный DSH</text>
  </g>
  <g>
    <rect x="210" y="100" width="150" height="70" rx="10" fill="#1e293b" stroke="#475569"/>
    <text x="285" y="128" fill="#cbd5e1" font-size="13" text-anchor="middle">Ранг 200</text>
    <text x="285" y="150" fill="#94a3b8" font-size="12" text-anchor="middle">проектный агентов</text>
  </g>
  <g>
    <rect x="380" y="100" width="150" height="70" rx="10" fill="#1e293b" stroke="#475569"/>
    <text x="455" y="128" fill="#cbd5e1" font-size="13" text-anchor="middle">Ранг 300</text>
    <text x="455" y="150" fill="#94a3b8" font-size="12" text-anchor="middle">customSkillDirs</text>
  </g>
  <g>
    <rect x="550" y="100" width="190" height="70" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
    <text x="645" y="126" fill="#bbf7d0" font-size="13" font-weight="700" text-anchor="middle">Ранг 400 — НАШ ПРИЧАЛ</text>
    <text x="645" y="148" fill="#86efac" font-size="12" text-anchor="middle">&lt;dshHome&gt;/skills</text>
  </g>
  <g>
    <rect x="760" y="100" width="100" height="70" rx="10" fill="#1e293b" stroke="#475569"/>
    <text x="810" y="128" fill="#cbd5e1" font-size="13" text-anchor="middle">Ранг 500</text>
    <text x="810" y="150" fill="#94a3b8" font-size="12" text-anchor="middle">агентов</text>
  </g>

  <path d="M 645 175 L 645 215" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="420" y="220" width="450" height="88" rx="10" fill="#052e16" stroke="#22c55e"/>
  <text x="645" y="248" fill="#dcfce7" font-size="14" font-weight="700" text-anchor="middle">6 новых умений + graphflow</text>
  <text x="645" y="272" fill="#86efac" font-size="12" text-anchor="middle">skill-catalog · skill-lessons · skill-progress</text>
  <text x="645" y="290" fill="#86efac" font-size="12" text-anchor="middle">skill-media · skill-license · skill-qc</text>

  <rect x="40" y="220" width="340" height="88" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="210" y="248" fill="#cbd5e1" font-size="13" font-weight="700" text-anchor="middle">Не трогаем</text>
  <text x="210" y="270" fill="#94a3b8" font-size="12" text-anchor="middle">причал 500 — чужие грузы с замком</text>
  <text x="210" y="290" fill="#94a3b8" font-size="12" text-anchor="middle">.skill-lock.json</text>

  <text x="40" y="360" fill="#64748b" font-size="12">Проверено: graphflow на причале 400 светится в каталоге борта → причал рабочий.</text>
  <text x="40" y="384" fill="#64748b" font-size="12">Истина: строковый поиск по app.asar, раздел «Roots and priority»</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
  </defs>
</svg>

# DSH bundle patch: installed profiles merge this layer automatically.
#
# Полное имя пакета обязательно: реестр client-modules разрешает браузерный
# бандл по имени loader-записи, поэтому сокращённое имя оставило бы UI-половину
# молча вне window.__DSH_BOOT__.
- insert:
    - id: dsh-client-voice-eternia
      name: dsh-client-voice-eternia
